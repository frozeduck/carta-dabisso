plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.sabotino.cartadabisso'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'eu.sabotino.cartadabisso'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.3'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}
